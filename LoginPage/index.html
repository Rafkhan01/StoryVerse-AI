<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stunning Sign In</title>
    <!-- Use Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 3D Particle Background Wrapper -->
    <div id="three-container"></div>

    <main class="main-container">
        <!-- Left Side: Character Animation -->
        <div class="animation-wrapper">
            <canvas id="sequence-canvas"></canvas>
        </div>

        <!-- Right Side: Glassmorphism Sign-In Form -->
        <div class="form-wrapper" id="sign-in-container">
            <div class="form-header">
                <h2>Register Now</h2>
                <p>Enter your details to proceed.</p>
            </div>
            
            <form id="signin-form">
                <div class="input-field">
                    <input type="text" id="name" required placeholder=" ">
                    <label for="name">Name</label>
                </div>
                <div class="input-field">
                    <input type="text" id="surname" required placeholder=" ">
                    <label for="surname">Surname</label>
                </div>
                <div class="input-field">
                    <input type="email" id="email" required placeholder=" ">
                    <label for="email">Email Address</label>
                </div>
                
                <button type="submit" class="glow-button">
                    <span>Submit</span>
                </button>
            </form>
        </div>
    </main>

    <!-- Scripts -->
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Three.js Optional BG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Custom Logic -->
    <script src="script.js"></script>
</body>
</html>
