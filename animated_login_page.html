<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Prediction - Login Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Subtle animated background */
        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .background-animation::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: backgroundMove 20s linear infinite;
        }

        @keyframes backgroundMove {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(50px, 50px) rotate(360deg); }
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 0;
            width: 450px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
            overflow: hidden;
            animation: slideInUp 0.8s ease-out;
        }

        @keyframes slideInUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 40px 30px;
            text-align: center;
            color: white;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 24px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
            font-weight: 400;
        }

        .form-container {
            padding: 40px;
        }

        .form-toggle {
            display: flex;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 30px;
            position: relative;
        }

        .toggle-btn {
            flex: 1;
            padding: 12px 20px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #6c757d;
            font-weight: 500;
            font-size: 14px;
            position: relative;
            z-index: 2;
        }

        .toggle-btn.active {
            color: #495057;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .form {
            transition: all 0.5s ease;
        }

        .form.hidden {
            transform: translateX(-100%);
            opacity: 0;
            position: absolute;
            top: 0;
            left: 0;
            width: calc(100% - 80px);
        }

        .form-group {
            position: relative;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #495057;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            background: #f8f9fa;
            color: #495057;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
            background: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .form-group i {
            position: absolute;
            left: 18px;
            top: 63%;
            transform: translateY(-50%);
            color: #adb5bd;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus + i {
            color: #667eea;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .forgot-password {
            text-align: center;
            margin-top: 20px;
        }

        .forgot-password a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: #5a6fd8;
        }

        .footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid #e9ecef;
            background: #f8f9fa;
            color: #6c757d;
            font-size: 12px;
        }

        .input-animation {
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            animation: slideInRight 0.3s ease-out;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .notification.success {
            background: #28a745;
        }

        .notification.error {
            background: #dc3545;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Responsive design */
        @media (max-width: 480px) {
            .login-container {
                width: 95%;
                margin: 20px;
            }
            
            .header,
            .form-container {
                padding: 30px 25px;
            }
            
            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="background-animation"></div>
    
    <div class="login-container">
        <div class="header">
            <div class="logo-container">
                <div class="logo-icon">
                    <i class="fas fa-book-open"></i>
                </div>
                <h1>Story Prediction</h1>
                <p>AI-Powered Narrative Analytics Platform</p>
            </div>
        </div>
        
        <div class="form-container">
            <div class="form-toggle">
                <div class="toggle-btn active" onclick="showLogin()">Sign In</div>
                <div class="toggle-btn" onclick="showSignup()">Create Account</div>
            </div>
            
            <div class="form-wrapper" style="position: relative;">
                <!-- Login Form -->
                <div class="form" id="loginForm">
                    <div class="form-group input-animation">
                        <label for="loginUsername">Username</label>
                        <input type="text" id="loginUsername" placeholder="Enter your username" required>
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="form-group input-animation">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter your password" required>
                        <i class="fas fa-lock"></i>
                    </div>
                    <button class="submit-btn" onclick="handleLogin()">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </button>
                    <div class="forgot-password">
                        <a href="#">Forgot your password?</a>
                    </div>
                </div>
                
                <!-- Signup Form -->
                <div class="form hidden" id="signupForm">
                    <div class="form-group input-animation">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" placeholder="Enter your first name" required>
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="form-group input-animation">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" placeholder="Enter your last name" required>
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="form-group input-animation">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="form-group input-animation">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" required>
                        <i class="fas fa-calendar"></i>
                    </div>
                    <div class="form-group input-animation">
                        <label for="signupUsername">Username</label>
                        <input type="text" id="signupUsername" placeholder="Choose a username" required>
                        <i class="fas fa-user-plus"></i>
                    </div>
                    <div class="form-group input-animation">
                        <label for="signupPassword">Password</label>
                        <input type="password" id="signupPassword" placeholder="Create a password" required>
                        <i class="fas fa-lock"></i>
                    </div>
                    <button class="submit-btn" onclick="handleSignup()">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>
                </div>
            </div>
        </div>
        
        <div class="footer">
            © 2025 Story Prediction Platform. All rights reserved.
        </div>
    </div>

    <script>
        // Toggle between login and signup forms
        function showLogin() {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const toggleBtns = document.querySelectorAll('.toggle-btn');
            
            loginForm.classList.remove('hidden');
            signupForm.classList.add('hidden');
            
            toggleBtns[0].classList.add('active');
            toggleBtns[1].classList.remove('active');
            
            setTimeout(() => animateInputs(loginForm), 100);
        }

        function showSignup() {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const toggleBtns = document.querySelectorAll('.toggle-btn');
            
            loginForm.classList.add('hidden');
            signupForm.classList.remove('hidden');
            
            toggleBtns[0].classList.remove('active');
            toggleBtns[1].classList.add('active');
            
            setTimeout(() => animateInputs(signupForm), 100);
        }

        // Animate form inputs
        function animateInputs(form) {
            const inputs = form.querySelectorAll('.form-group');
            inputs.forEach((input, index) => {
                input.style.animation = 'none';
                setTimeout(() => {
                    input.style.animation = `fadeInUp 0.6s ease-out ${index * 0.1}s both`;
                }, 10);
            });
        }

        // Handle form submissions
        function handleLogin() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            
            if (username && password) {
                showNotification('Welcome back to Story Prediction!', 'success');
                // Here you would typically send the data to your server
                console.log('Login:', { username, password });
                
                // Simulate redirect after successful login
                setTimeout(() => {
                    showNotification('Redirecting to dashboard...', 'success');
                }, 1500);
            } else {
                showNotification('Please fill in all required fields', 'error');
            }
        }

        function handleSignup() {
            const formData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                dob: document.getElementById('dob').value,
                username: document.getElementById('signupUsername').value,
                password: document.getElementById('signupPassword').value
            };
            
            if (Object.values(formData).every(value => value)) {
                showNotification('Account created successfully!', 'success');
                // Here you would typically send the data to your server
                console.log('Signup:', formData);
                
                // Switch to login form after successful signup
                setTimeout(() => {
                    showLogin();
                    showNotification('Please sign in with your new account', 'success');
                }, 2000);
            } else {
                showNotification('Please fill in all required fields', 'error');
            }
        }

        // Show notification
        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                ${message}
            `;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideInRight 0.3s ease-out reverse';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            animateInputs(document.getElementById('loginForm'));
        });
    </script>
</body>
</html>
